services:

  backend:
    build:
      context: ./backend
    container_name: retail-analytics-backend
    ports:
      - "5000:5000"
    volumes:
      - retail_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: retail-analytics-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  retail_uploads: